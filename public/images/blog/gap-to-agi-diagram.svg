      </g>
      <use href="#chess-rook" x="56" y="0" width="28" height="28" color="#151712" />
      <use href="#chess-pawn" x="0" y="28" width="28" height="28" color="#151712" />
      <use href="#chess-pawn" x="112" y="28" width="28" height="28" color="#151712" />
      <use href="#chess-bishop" x="56" y="84" width="28" height="28" color="#fffdfa" />
      <use href="#chess-king" x="56" y="112" width="28" height="28" color="#fffdfa" />
      <rect width="140" height="140" rx="9" fill="none" stroke="#151712" stroke-width="3" />
    </g>
    <path d="M397 230H535" stroke="#151712" stroke-linecap="round" stroke-width="4" />
    <circle cx="397" cy="230" r="8" fill="#151712" />
    <circle cx="512" cy="230" r="9" fill="#4056f4" />
  </g>

  <!-- Problem structure: hidden state and beliefs -->
  <g>
    <text class="problem-label" x="55" y="433">HIDDEN STATE</text>
    <text class="problem-label" x="55" y="457">+ BELIEF UPDATES</text>

    <g transform="translate(235 389)">
      <rect width="54" height="92" rx="8" fill="#fffdfa" stroke="#151712" stroke-width="2.5" />
