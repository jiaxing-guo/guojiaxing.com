      <text class="card-rank" x="10" y="24">K</text>
      <text x="27" y="62" fill="#4056f4" font-size="27" text-anchor="middle">♥</text>
    </g>
    <path d="M443 450H535" stroke="#151712" stroke-linecap="round" stroke-width="4" />
    <circle cx="443" cy="450" r="8" fill="#151712" />
    <circle cx="512" cy="450" r="9" fill="#4056f4" />
  </g>

