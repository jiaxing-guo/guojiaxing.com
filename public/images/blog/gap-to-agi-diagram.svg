<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">The Gap to AGI: an adaptive computational manifold</title>
  <desc id="description">
    Chess, poker, and strategic interaction supply different problem structures. One shared computational manifold reshapes into search, belief, and strategy before producing a decision.
  </desc>

  <defs>
    <symbol id="chess-rook" viewBox="0 0 28 28">
      <path d="M5 4h5v4h3V4h4v4h3V4h4v8l-3 3v7H7v-7l-3-3V4Z" fill="currentColor" stroke="#151712" stroke-linejoin="round" stroke-width="1.2" />
      <path d="M5 22h18v4H5Z" fill="currentColor" stroke="#151712" stroke-linejoin="round" stroke-width="1.2" />
    </symbol>
    <symbol id="chess-pawn" viewBox="0 0 28 28">
      <circle cx="14" cy="7" r="4.5" fill="currentColor" stroke="#151712" stroke-width="1.2" />
      <path d="M10 12h8c0 4 2 6 4 9H6c2-3 4-5 4-9Z" fill="currentColor" stroke="#151712" stroke-linejoin="round" stroke-width="1.2" />
      <path d="M5 21h18v4H5Z" fill="currentColor" stroke="#151712" stroke-linejoin="round" stroke-width="1.2" />
    </symbol>
    <symbol id="chess-bishop" viewBox="0 0 28 28">
      <path d="M14 3c5 4 7 8 7 12 0 3-2 5-5 7h6v4H6v-4h6c-3-2-5-4-5-7 0-4 2-8 7-12Z" fill="currentColor" stroke="#151712" stroke-linejoin="round" stroke-width="1.2" />
      <path d="m12 8 5 5" fill="none" stroke="#151712" stroke-linecap="round" stroke-width="1.4" />
    </symbol>
    <symbol id="chess-king" viewBox="0 0 28 28">
      <path d="M12 2h4v4h4v4h-4v4h-4v-4H8V6h4Z" fill="currentColor" stroke="#151712" stroke-linejoin="round" stroke-width="1.2" />
      <path d="M7 15h14l-2 7H9Z" fill="currentColor" stroke="#151712" stroke-linejoin="round" stroke-width="1.2" />
      <path d="M6 22h16v4H6Z" fill="currentColor" stroke="#151712" stroke-linejoin="round" stroke-width="1.2" />
    </symbol>
    <style>
      text {
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      .section-label {
        fill: #151712;
        font-size: 21px;
        font-weight: 750;
        letter-spacing: 1.8px;
      }
      .problem-label {
        fill: #151712;
        font-size: 15px;
        font-weight: 760;
        letter-spacing: 1.1px;
      }
      .decision-label {
        fill: #151712;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 1.4px;
      }
      .card-rank {
        fill: #151712;
        font-size: 19px;
        font-weight: 800;
      }
      .contour {
        fill: none;
        stroke: #64665f;
        stroke-dasharray: 2 8;
        stroke-linecap: round;
        stroke-width: 1.8;
        opacity: 0.72;
      }
      .route {
        fill: none;
        stroke: #4056f4;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 5;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f2f0e9" />

  <!-- Section hierarchy -->
  <g aria-hidden="true">
    <text class="section-label" x="55" y="74">PROBLEM STRUCTURE</text>
    <path d="M55 102H365" stroke="#151712" stroke-width="2" />

    <text class="section-label" x="615" y="74">COMPUTATIONAL MANIFOLD</text>
    <path d="M615 102H1150" stroke="#151712" stroke-width="2" />

    <text class="section-label" x="1300" y="74">DECISION</text>
    <path d="M1300 102H1545" stroke="#151712" stroke-width="2" />
  </g>

  <!-- Problem structure: full observability and search -->
  <g>
    <text class="problem-label" x="55" y="185">FULL</text>
    <text class="problem-label" x="55" y="209">OBSERVABILITY</text>
    <text class="problem-label" x="55" y="233">+ DEEP SEARCH</text>

    <g transform="translate(235 155)">
      <rect width="140" height="140" rx="9" fill="#fffdfa" />
      <g fill="#e9e6dc">
        <rect x="28" width="28" height="28" />
