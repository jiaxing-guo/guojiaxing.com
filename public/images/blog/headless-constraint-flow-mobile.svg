<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title description">
  <title id="title">Mobile constraint flow for headless and agentic products</title>
  <desc id="description">
    A vertical flow shows fixed interfaces and handoffs being removed, complexity relocating into authorization, evaluation, and recovery, then authority, hidden errors, and failures becoming amplified.
  </desc>
