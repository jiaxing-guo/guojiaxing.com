<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">The Price of Seeing</title>
  <desc id="description">
    Passive play reveals only selected poker hands, producing a precise but biased estimate.
    Safe exploration reveals the censored hands and recovers the true value while preserving a safety floor.
  </desc>

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#151712" />
    </marker>
    <marker id="arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#4056f4" />
    </marker>
    <style>
      text {
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      .section-label {
        fill: #151712;
        font-size: 21px;
        font-weight: 750;
        letter-spacing: 1.8px;
      }
      .micro-label {
        fill: #64665f;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 1.1px;
      }
      .card-rank {
        fill: #151712;
        font-size: 22px;
        font-weight: 800;
      }
      .card-suit {
        font-size: 34px;
        font-weight: 700;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f2f0e9" />

  <!-- Column hierarchy -->
  <g aria-hidden="true">
    <text class="section-label" x="72" y="82">POLICY</text>
    <path d="M72 108H360" stroke="#151712" stroke-width="2" />

    <text class="section-label" x="430" y="82">WHAT BECOMES VISIBLE</text>
    <path d="M430 108H770" stroke="#151712" stroke-width="2" />

    <text class="section-label" x="885" y="82">OBSERVED DATA</text>
    <path d="M885 108H1165" stroke="#151712" stroke-width="2" />

    <text class="section-label" x="1238" y="82">CONFIDENTLY WRONG</text>
    <path d="M1238 108H1528" stroke="#151712" stroke-width="2" />
  </g>

  <!-- Policy and two observation routes -->
  <g>
    <path d="M72 481H87" fill="none" stroke="#151712" stroke-linecap="round" stroke-width="10" />
    <circle cx="112" cy="481" r="25" fill="#151712" />
    <circle cx="112" cy="481" r="13" fill="#4056f4" />

    <path
      d="M130 466C170 430 110 350 150 310"
      fill="none"
      stroke="#151712"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="8"
    />
    <path
      d="M130 496C170 532 110 612 150 652"
      fill="none"
      stroke="#4056f4"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="8"
    />

    <rect x="150" y="266" width="210" height="88" rx="20" fill="#f2f0e9" stroke="#151712" stroke-width="3" />
    <text x="255" y="304" fill="#151712" font-size="16" font-weight="800" letter-spacing="1.3" text-anchor="middle">PASSIVE</text>
    <text x="255" y="329" fill="#151712" font-size="16" font-weight="800" letter-spacing="1.3" text-anchor="middle">OBSERVATION</text>
    <path d="M360 310H410" fill="none" marker-end="url(#arrow-ink)" stroke="#151712" stroke-linecap="round" stroke-width="6" />

    <rect x="150" y="608" width="210" height="88" rx="20" fill="#4056f4" />
    <text x="255" y="646" fill="#fff" font-size="16" font-weight="800" letter-spacing="1.3" text-anchor="middle">SAFE</text>
    <text x="255" y="671" fill="#fff" font-size="16" font-weight="800" letter-spacing="1.3" text-anchor="middle">EXPLORATION</text>
    <path d="M360 652H410" fill="none" marker-end="url(#arrow-signal)" stroke="#4056f4" stroke-linecap="round" stroke-width="6" />
  </g>

  <!-- Passive observation: two revealed hands and two censored hands -->
  <g>
    <text class="micro-label" x="430" y="156">REVEALED AT SHOWDOWN</text>

    <g transform="translate(430 176)">
      <rect width="96" height="120" rx="11" fill="#fffdfa" stroke="#151712" stroke-width="3" />
      <text class="card-rank" x="14" y="29">A</text>
      <text class="card-suit" x="48" y="76" fill="#151712" text-anchor="middle">♠</text>
    </g>
    <g transform="translate(548 176)">
      <rect width="96" height="120" rx="11" fill="#fffdfa" stroke="#151712" stroke-width="3" />
      <text class="card-rank" x="14" y="29">K</text>
      <text class="card-suit" x="48" y="76" fill="#4056f4" text-anchor="middle">♥</text>
    </g>

    <text class="micro-label" x="430" y="328">CENSORED BY FOLDS</text>
    <g transform="translate(430 346)">
      <rect width="96" height="120" rx="11" fill="#e9e6dc" stroke="#64665f" stroke-dasharray="8 7" stroke-width="3" />
      <text x="48" y="75" fill="#64665f" font-size="34" font-weight="750" text-anchor="middle">?</text>
    </g>
    <g transform="translate(548 346)">
      <rect width="96" height="120" rx="11" fill="#e9e6dc" stroke="#64665f" stroke-dasharray="8 7" stroke-width="3" />
      <text x="48" y="75" fill="#64665f" font-size="34" font-weight="750" text-anchor="middle">?</text>
    </g>
  </g>

  <!-- Safe exploration: the same hidden composition becomes visible -->
  <g>
    <text class="micro-label" x="430" y="522">REVEALED THROUGH PLAY</text>

    <g transform="translate(430 542)">
      <rect width="96" height="112" rx="11" fill="#fffdfa" stroke="#151712" stroke-width="3" />
      <text class="card-rank" x="14" y="29">A</text>
      <text class="card-suit" x="48" y="72" fill="#151712" text-anchor="middle">♠</text>
    </g>
    <g transform="translate(548 542)">
      <rect width="96" height="112" rx="11" fill="#fffdfa" stroke="#151712" stroke-width="3" />
      <text class="card-rank" x="14" y="29">K</text>
      <text class="card-suit" x="48" y="72" fill="#4056f4" text-anchor="middle">♥</text>
    </g>
    <g transform="translate(430 670)">
      <rect width="96" height="112" rx="11" fill="#fffdfa" stroke="#151712" stroke-width="3" />
      <text class="card-rank" x="14" y="29">7</text>
      <text class="card-suit" x="48" y="72" fill="#4056f4" text-anchor="middle">♦</text>
    </g>
    <g transform="translate(548 670)">
      <rect width="96" height="112" rx="11" fill="#fffdfa" stroke="#151712" stroke-width="3" />
      <text class="card-rank" x="14" y="29">2</text>
      <text class="card-suit" x="48" y="72" fill="#151712" text-anchor="middle">♣</text>
    </g>
  </g>

  <!-- Flow arrows -->
  <g fill="none" stroke-linecap="round" stroke-width="5">
    <path d="M700 310H836" marker-end="url(#arrow-ink)" stroke="#151712" />
    <path d="M700 652H836" marker-end="url(#arrow-ink)" stroke="#151712" />
    <path d="M1157 310H1220" marker-end="url(#arrow-ink)" stroke="#151712" />
    <path d="M1157 652H1220" marker-end="url(#arrow-ink)" stroke="#151712" />
  </g>

  <!-- Reveal-conditioned observed data -->
  <g>
    <path d="M875 420H1163" stroke="#151712" stroke-linecap="round" stroke-width="4" />
    <g stroke="#151712" stroke-width="2">
      <rect x="891" y="373" width="25" height="47" fill="#cdd3ff" />
      <rect x="921" y="334" width="25" height="86" fill="#4056f4" />
      <rect x="951" y="278" width="25" height="142" fill="#cdd3ff" />
      <rect x="981" y="218" width="25" height="202" fill="#4056f4" />
      <rect x="1011" y="256" width="25" height="164" fill="#cdd3ff" />
      <rect x="1041" y="310" width="25" height="110" fill="#cdd3ff" />
      <rect x="1071" y="354" width="25" height="66" fill="#cdd3ff" />
      <rect x="1101" y="382" width="25" height="38" fill="#cdd3ff" />
      <rect x="1131" y="399" width="25" height="21" fill="#cdd3ff" />
    </g>
    <text class="micro-label" x="1019" y="452" text-anchor="middle">REVEAL-CONDITIONED</text>
  </g>

  <!-- De-censored observed data -->
  <g>
    <path d="M875 758H1163" stroke="#151712" stroke-linecap="round" stroke-width="4" />
    <g stroke="#151712" stroke-width="2">
      <rect x="891" y="734" width="25" height="24" fill="#cdd3ff" />
      <rect x="921" y="704" width="25" height="54" fill="#4056f4" />
      <rect x="951" y="663" width="25" height="95" fill="#cdd3ff" />
      <rect x="981" y="618" width="25" height="140" fill="#4056f4" />
      <rect x="1011" y="584" width="25" height="174" fill="#cdd3ff" />
      <rect x="1041" y="618" width="25" height="140" fill="#4056f4" />
      <rect x="1071" y="663" width="25" height="95" fill="#cdd3ff" />
      <rect x="1101" y="704" width="25" height="54" fill="#4056f4" />
      <rect x="1131" y="734" width="25" height="24" fill="#cdd3ff" />
    </g>
    <text class="micro-label" x="1019" y="790" text-anchor="middle">DE-CENSORED EVIDENCE</text>
  </g>

  <!-- Passive estimate: narrow and wrong -->
  <g>
    <path d="M1245 420H1536" stroke="#151712" stroke-linecap="round" stroke-width="4" />
    <path
      d="M1258 420C1280 419 1288 270 1332 270S1384 419 1410 420Z"
      fill="#cdd3ff"
      stroke="#4056f4"
      stroke-width="5"
    />
    <path d="M1332 258V420" stroke="#4056f4" stroke-dasharray="8 8" stroke-width="3" />

    <circle cx="1490" cy="420" r="9" fill="#151712" />
    <path d="M1490 411V240" stroke="#151712" stroke-width="4" />
    <rect x="1454" y="204" width="72" height="36" rx="8" fill="#151712" />
    <text x="1490" y="228" fill="#fff" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle">TRUE</text>
  </g>

  <!-- Corrected estimate: centered on truth -->
  <g>
    <text x="1238" y="520" fill="#4056f4" font-size="15" font-weight="800" letter-spacing="1.5">CORRECTED</text>
    <path d="M1245 758H1536" stroke="#151712" stroke-linecap="round" stroke-width="4" />
    <path
      d="M1284 758C1317 756 1333 594 1391 594S1465 756 1498 758Z"
      fill="#cdd3ff"
      stroke="#4056f4"
      stroke-width="5"
    />
    <path d="M1391 580V758" stroke="#151712" stroke-dasharray="8 8" stroke-width="3" />
    <circle cx="1391" cy="758" r="9" fill="#151712" />
    <path d="M1391 585V554" stroke="#151712" stroke-width="4" />
    <rect x="1355" y="518" width="72" height="36" rx="8" fill="#151712" />
    <text x="1391" y="542" fill="#fff" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle">TRUE</text>
  </g>

  <!-- Safety constraint -->
  <g>
    <path d="M72 844H1528" stroke="#4056f4" stroke-linecap="round" stroke-width="4" />
    <rect x="674" y="818" width="252" height="52" rx="18" fill="#f2f0e9" stroke="#4056f4" stroke-width="3" />
    <path d="M714 833 726 838v10c0 8-5 13-12 17-7-4-12-9-12-17v-10Z" fill="#4056f4" />
    <text x="742" y="851" fill="#4056f4" font-size="16" font-weight="800" letter-spacing="1.3">SAFETY FLOOR</text>
  </g>
</svg>
