<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title description">
  <title id="title">Mobile comparison of SaaS, headless, and agentic architectures</title>
  <desc id="description">
    Three stacked rows show a person using a browser, several devices converging through an API, and a goal entering an agent tool loop. All connect to unresolved information, trust, security, control, and cost constraints.
  </desc>
  <defs>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#151712" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#4056f4" />
    </marker>
    <style>
      text { font-family: "Helvetica Neue", Arial, sans-serif; }
      .heading { fill: #151712; font-size: 25px; font-weight: 830; letter-spacing: 2px; }
      .anchor { fill: #151712; font-size: 13px; font-weight: 830; letter-spacing: 1px; }
      .flow { fill: none; stroke: #151712; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
      .blue { fill: none; stroke: #4056f4; stroke-linecap: round; stroke-linejoin: round; stroke-width: 6; }
    </style>
  </defs>
  <rect width="720" height="1040" fill="#f2f0e9" />

  <!-- SaaS row -->
  <text class="heading" x="38" y="55">SAAS</text>
  <path d="M38 76H682" stroke="#151712" stroke-width="2" />
  <circle cx="95" cy="151" r="20" fill="#151712" />
  <path d="M61 205c4-29 19-42 34-42s30 13 34 42Z" fill="#151712" />
  <path class="flow" d="M136 174H188" marker-end="url(#arrow-black)" />
  <rect x="210" y="112" width="188" height="124" rx="17" fill="#fffdfa" stroke="#151712" stroke-width="4" />
  <path d="M210 149H398" stroke="#151712" stroke-width="4" />
  <circle cx="232" cy="130" r="5" fill="#151712" /><circle cx="249" cy="130" r="5" fill="#151712" /><circle cx="266" cy="130" r="5" fill="#151712" />
  <rect x="235" y="169" width="56" height="42" rx="7" fill="#cdd3ff" />
  <path d="M311 174H371M311 192H358M311 210H368" stroke="#151712" stroke-linecap="round" stroke-width="4" />
  <path class="flow" d="M404 174H488" marker-end="url(#arrow-black)" />
  <rect x="510" y="119" width="142" height="110" rx="20" fill="#151712" />
  <ellipse cx="581" cy="154" rx="30" ry="11" fill="none" stroke="#fff" stroke-width="5" />
  <path d="M551 154v27c0 15 60 15 60 0v-27m-60 14c0 15 60 15 60 0" fill="none" stroke="#fff" stroke-width="5" />

  <!-- Headless row -->
  <text class="heading" x="38" y="316">HEADLESS</text>
  <path d="M38 337H682" stroke="#151712" stroke-width="2" />
  <rect x="55" y="380" width="90" height="63" rx="8" fill="#fffdfa" stroke="#151712" stroke-width="4" />
  <path d="M46 447H154" stroke="#151712" stroke-linecap="round" stroke-width="6" />
  <rect x="171" y="372" width="42" height="81" rx="9" fill="#fffdfa" stroke="#151712" stroke-width="4" />
  <circle cx="192" cy="441" r="3" fill="#151712" />
  <circle cx="265" cy="412" r="34" fill="#fffdfa" stroke="#151712" stroke-width="4" />
  <path d="M250 383h30l-6-13h-18Z" fill="#151712" />
  <path class="blue" d="M100 449V477H304M192 453V477M265 446V477" />
  <path class="blue" d="M304 477V492" marker-end="url(#arrow-blue)" />
  <rect x="328" y="392" width="126" height="105" rx="21" fill="#4056f4" />
  <path d="m360 435-18 12 18 12M421 435l18 12-18 12M405 423l-28 48" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" />
  <path class="flow" d="M460 445H488" marker-end="url(#arrow-black)" />
  <rect x="510" y="390" width="142" height="110" rx="20" fill="#151712" />
  <ellipse cx="581" cy="425" rx="30" ry="11" fill="none" stroke="#fff" stroke-width="5" />
  <path d="M551 425v27c0 15 60 15 60 0v-27m-60 14c0 15 60 15 60 0" fill="none" stroke="#fff" stroke-width="5" />

