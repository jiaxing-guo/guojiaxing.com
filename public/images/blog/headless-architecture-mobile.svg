  <circle cx="304" cy="688" r="27" fill="#151712" />
  <circle cx="304" cy="680" r="7" fill="#fff" />
  <path d="M292 704c3-12 21-12 24 0" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="5" />
  <rect x="194" y="655" width="70" height="66" rx="16" fill="#fffdfa" stroke="#151712" stroke-width="3" />
  <path d="m215 692 13-13 15 15m-15-15v27" fill="none" stroke="#151712" stroke-linecap="round" stroke-width="5" />
  <rect x="344" y="655" width="70" height="66" rx="16" fill="#fffdfa" stroke="#151712" stroke-width="3" />
  <path d="M360 674c0-6 38-6 38 0s-38 6-38 0Zm0 0v24c0 6 38 6 38 0v-24m-38 12c0 6 38 6 38 0" fill="none" stroke="#151712" stroke-width="4" />
  <path class="flow" d="M382 688H488" marker-end="url(#arrow-black)" />
  <rect x="510" y="633" width="142" height="110" rx="20" fill="#151712" />
  <ellipse cx="581" cy="668" rx="30" ry="11" fill="none" stroke="#fff" stroke-width="5" />
  <path d="M551 668v27c0 15 60 15 60 0v-27m-60 14c0 15 60 15 60 0" fill="none" stroke="#fff" stroke-width="5" />

  <!-- Shared constraints -->
  <path d="M72 864H648" stroke="#4056f4" stroke-linecap="round" stroke-width="5" />
  <g fill="#f2f0e9" stroke="#4056f4" stroke-width="4">
    <circle cx="72" cy="864" r="35" /><circle cx="216" cy="864" r="35" /><circle cx="360" cy="864" r="35" /><circle cx="504" cy="864" r="35" /><circle cx="648" cy="864" r="35" />
  </g>
  <circle cx="72" cy="855" r="6" fill="#151712" /><path d="M72 868v16" stroke="#151712" stroke-linecap="round" stroke-width="5" />
  <circle cx="206" cy="858" r="7" fill="#151712" /><circle cx="226" cy="858" r="7" fill="#151712" /><path d="M194 880c3-12 21-12 24 0m0 0c3-12 21-12 24 0" fill="none" stroke="#151712" stroke-linecap="round" stroke-width="4" />
  <rect x="343" y="857" width="34" height="27" rx="6" fill="#151712" /><path d="M349 857v-8c0-16 22-16 22 0v8" fill="none" stroke="#151712" stroke-width="4" />
  <path d="m504 837 23 10v14c0 16-9 26-23 33-14-7-23-17-23-33v-14Z" fill="none" stroke="#151712" stroke-width="4" /><path d="m493 862 8 8 15-19" fill="none" stroke="#151712" stroke-linecap="round" stroke-width="4" />
  <text x="648" y="879" fill="#151712" font-size="40" font-weight="650" text-anchor="middle">$</text>
  <text class="anchor" x="72" y="930" text-anchor="middle">INFO</text><text class="anchor" x="216" y="930" text-anchor="middle">TRUST</text><text class="anchor" x="360" y="930" text-anchor="middle">SECURITY</text><text class="anchor" x="504" y="930" text-anchor="middle">CONTROL</text><text class="anchor" x="648" y="930" text-anchor="middle">COST</text>
  <path d="M38 993H682" stroke="#151712" stroke-width="2" />
</svg>
